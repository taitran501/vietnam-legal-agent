# Deterministic CI overlay for the current Compose topology.
# Exercise the gateway, backend, PostgreSQL, and Redis in preview mode without
# requiring an external corpus build or OpenAI request.
services:
  backend:
    environment:
      CORPUS_RUNTIME_MODE: preview
      OPENAI_API_KEY: ci-smoke-placeholder
      REQUIRE_AUTH: "false"
      RATE_LIMIT_FAIL_OPEN: "true"
      ENABLE_TRACE_DEBUG_API: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
