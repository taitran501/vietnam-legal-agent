pid /tmp/nginx.pid;

events {}

http {
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    # ── Upstream services ────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 8080;
        server_name _;          # accepts any hostname / IP on the LAN

        # CRITICAL: For production, configure HTTPS with SSL/TLS
        # Use Let's Encrypt / certbot for free certificates
        # Example:
        # listen 443 ssl;
        # ssl_certificate /etc/letsencrypt/live/yourdomain/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;

        # Allow multipart framing overhead; the API enforces a 10 MiB file payload.
        client_max_body_size 11m;

        # ── Backend API (/api/* and /docs) ───────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Required for SSE streaming
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     120s;
            chunked_transfer_encoding on;
        }

        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /metrics {
            # Metrics are for local Prometheus or an internal scrape network.
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://backend/internal/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── React single-page frontend (everything else) ─────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
