events {}

http {
    # ── Upstream services ────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 80;
        server_name _;          # accepts any hostname / IP on the LAN

        # CRITICAL: For production, configure HTTPS with SSL/TLS
        # Use Let's Encrypt / certbot for free certificates
        # Example:
        # listen 443 ssl;
        # ssl_certificate /etc/letsencrypt/live/yourdomain/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 5m;

        # ── Backend API (/api/* and /docs) ───────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # Required for SSE streaming
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     120s;
            chunked_transfer_encoding on;
        }

        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
        }

        location /metrics {
            # SECURITY: Restrict metrics access to localhost/internal network only
            # For production: Add basic auth or IP whitelist
            # allow 127.0.0.1;
            # allow 10.0.0.0/8;
            # deny all;
            
            proxy_pass http://backend/metrics;
            proxy_set_header Host $host;
            
            # NOTE: In production, enable authentication:
            # auth_basic "Prometheus Metrics";
            # auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # ── React single-page frontend (everything else) ─────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 120s;
        }
    }
}
