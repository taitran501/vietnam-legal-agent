name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest -q

      - name: Bounded-workflow lint
        run: >-
          python -m ruff check
          src/epr_agent
          tests/agent
          tests/trajectory
          tests/tools
          tests/e2e_backend.py
          tests/eval/run_eval.py
          tests/test_build_index_cache.py
          tests/test_retrieval_benchmark.py
          tests/test_retrieval_client.py
          tests/test_router_fast_path.py
          tests/test_structural_chunking.py
          scripts/audit_law_collection.py
          scripts/build_index.py
          scripts/retrieval_benchmark.py
          scripts/structural_chunking.py
          backend/api/routes/chat.py
          backend/core/retrieval.py
          backend/core/router.py

      - name: Bounded-workflow type check
        run: python -m mypy src/epr_agent

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Frontend lint, unit tests, and build
        working-directory: frontend-react
        run: |
          npm run lint
          npm test
          npm run build

      - name: Install Chromium
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with deterministic FastAPI tools
        working-directory: frontend-react
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build deployable application images
        run: docker compose build backend frontend
