name: CI

on:
  pull_request:
  push: {}
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m scripts.sync_corpus_metadata --check
      - run: python -m pytest -q
      - run: python -m tests.eval.run_eval --suite all
      - run: python tests/eval/agent_harness.py --suite all
      - run: python tests/eval/persona_simulation.py --persona all
      - run: ruff check src/epr_agent backend scripts tests
      - run: mypy src/epr_agent backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  pilot-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      PILOT_LOAD_HOLD_SECONDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start deterministic two-worker SSE host
        run: |
          uvicorn tests.load_backend:app --host 127.0.0.1 --port 8010 --workers 2 > /tmp/pilot-load-server.log 2>&1 &
          echo $! > /tmp/pilot-load-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pilot-load-server.log
          exit 1
      - name: Enforce 50-turn pilot SLO
        run: python scripts/run_pilot_load_test.py --report artifacts/pilot-load-report.json
      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-load-report
          path: artifacts/pilot-load-report.json
          if-no-files-found: warn
      - name: Stop deterministic SSE host
        if: always()
        run: |
          if [ -f /tmp/pilot-load-server.pid ]; then
            kill "$(cat /tmp/pilot-load-server.pid)" || true
          fi

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
        working-directory: frontend-react
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-react
      - run: npm run test:e2e -- --reporter=line
        working-directory: frontend-react

  natural-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start deterministic natural-language SSE host
        run: |
          uvicorn tests.e2e_backend:app --host 127.0.0.1 --port 8010 > /tmp/natural-smoke-server.log 2>&1 &
          echo $! > /tmp/natural-smoke-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/natural-smoke-server.log
          exit 1
      - name: Replay structured natural-language smoke
        run: python scripts/run_natural_language_smoke.py --base-url http://127.0.0.1:8010 --report artifacts/natural-language-smoke.json
      - name: Upload natural-language smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-language-smoke-report
          path: artifacts/natural-language-smoke.json
          if-no-files-found: warn
      - name: Stop deterministic natural-language SSE host
        if: always()
        run: |
          if [ -f /tmp/natural-smoke-server.pid ]; then
            kill "$(cat /tmp/natural-smoke-server.pid)" || true
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Compose environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-password/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-smoke-password/' .env
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml config --quiet
      - name: Build and start the Compose topology
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml up -d --build
      - name: Verify gateway liveness and preview readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1/api/v1/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml ps -a
              docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml logs --no-color backend nginx postgres redis qdrant
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error http://127.0.0.1/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1/api/v1/ready
          curl --fail --silent --show-error http://127.0.0.1/ | grep -q 'id="root"'
      - name: Tear down Compose topology
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml down --volumes --remove-orphans
