name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: ruff check src/vietnam_legal_agent backend scripts tests
      - run: mypy src/vietnam_legal_agent backend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,universal]"
      - name: Build the content-locked multi-domain corpus
        run: python -m scripts.build_universal_index --download --rebuild
      - run: python -m pytest -q
      - run: python -m tests.eval.run_eval --suite all
      - run: python tests/eval/agent_harness.py --suite all
      - run: python tests/eval/persona_simulation.py --persona all

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  pilot-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      PILOT_LOAD_HOLD_SECONDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start deterministic two-worker SSE host
        run: |
          uvicorn tests.load_backend:app --host 127.0.0.1 --port 8010 --workers 2 > /tmp/pilot-load-server.log 2>&1 &
          echo $! > /tmp/pilot-load-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pilot-load-server.log
          exit 1
      - name: Enforce 50-turn pilot SLO
        run: python scripts/run_pilot_load_test.py --report artifacts/pilot-load-report.json
      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-load-report
          path: artifacts/pilot-load-report.json
          if-no-files-found: warn
      - name: Stop deterministic SSE host
        if: always()
        run: |
          if [ -f /tmp/pilot-load-server.pid ]; then
            kill "$(cat /tmp/pilot-load-server.pid)" || true
          fi

  e2e:
    # Each shard gets an isolated deterministic API and Vite server, so browser tests can run concurrently.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: e2e (${{ matrix.spec }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: agent-workflow
            shard: 1
            shards: 2
          - spec: agent-workflow
            shard: 2
            shards: 2
          - spec: live-agent
            shard: 1
            shards: 3
          - spec: live-agent
            shard: 2
            shards: 3
          - spec: live-agent
            shard: 3
            shards: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install Python and Node dependencies in parallel
        run: |
          set +e
          python -m pip install -e ".[dev]" &
          pip_pid=$!
          npm --prefix frontend-react ci
          npm_status=$?
          wait "$pip_pid"
          pip_status=$?
          if [ "$pip_status" -ne 0 ] || [ "$npm_status" -ne 0 ]; then
            echo "Dependency setup failed (pip=$pip_status, npm=$npm_status)."
            exit 1
          fi
      - run: npx playwright install chromium --only-shell
        working-directory: frontend-react
      - run: npm run test:e2e -- "e2e/${{ matrix.spec }}.spec.ts" --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=line
        working-directory: frontend-react

  natural-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start deterministic natural-language SSE host
        run: |
          uvicorn tests.e2e_backend:app --host 127.0.0.1 --port 8010 > /tmp/natural-smoke-server.log 2>&1 &
          echo $! > /tmp/natural-smoke-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/natural-smoke-server.log
          exit 1
      - name: Replay structured natural-language smoke
        run: python scripts/run_natural_language_smoke.py --base-url http://127.0.0.1:8010 --report artifacts/natural-language-smoke.json
      - name: Upload natural-language smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-language-smoke-report
          path: artifacts/natural-language-smoke.json
          if-no-files-found: warn
      - name: Stop deterministic natural-language SSE host
        if: always()
        run: |
          if [ -f /tmp/natural-smoke-server.pid ]; then
            kill "$(cat /tmp/natural-smoke-server.pid)" || true
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create isolated Compose environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-password/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-smoke-password/' .env
      - name: Prepare an empty corpus mount for blocked-readiness smoke
        run: |
          mkdir -p data/corpus/universal_legal
          touch data/corpus/universal_legal/universal_legal.db
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml config --quiet
      - name: Validate opt-in universal preview configuration
        run: docker compose -f docker-compose.yml -f docker-compose.universal-preview.yml config --quiet
      - name: Pull runtime images and start data services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml pull postgres redis nginx
          docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml up -d postgres redis
      - name: Build backend and frontend images concurrently
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.ci.hcl
          targets: backend,frontend
          load: true
      - name: Start the Compose topology from the built images
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml up -d --no-build
      - name: Verify gateway liveness and safe-degraded preview readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml ps -a
              docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml logs --no-color backend nginx postgres redis qdrant
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error http://127.0.0.1/api/v1/health
          ready_status=$(curl --silent --show-error --output /tmp/compose-ready.json --write-out '%{http_code}' http://127.0.0.1/api/v1/ready)
          test "$ready_status" = "503"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/compose-ready.json').read_text())
          assert payload['status'] == 'not_ready'
          assert payload['capabilities']['legal_chat']['status'] == 'blocked'
          PY
          curl --fail --silent --show-error http://127.0.0.1/ | grep -q 'id="root"'
      - name: Tear down Compose topology
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml down --volumes --remove-orphans
