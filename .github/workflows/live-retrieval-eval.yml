name: Live retrieval evaluation

on:
  schedule:
    - cron: "0 20 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    if: ${{ vars.ENABLE_LIVE_EVAL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: http://127.0.0.1:6333
      REQUIRE_AUTH: "false"
      LIVE_EVAL_QUERY_BUDGET: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate live-evaluation credentials
        run: test -n "$OPENAI_API_KEY"
      - name: Install retrieval runtime
        run: python -m pip install -e ".[dev]"
      - name: Build and evaluate baseline collection
        env:
          LAW_COLLECTION: law_collection_live_baseline
          CHUNKING_STRATEGY: sliding_window
        run: |
          python -m scripts.build_index
          python -m scripts.audit_law_collection --output live-baseline-audit.json
          python -m scripts.retrieval_benchmark --run-retrieval --collection "$LAW_COLLECTION" --collection-audit live-baseline-audit.json --output live-baseline.json
      - name: Build and evaluate structure-aware candidate
        env:
          LAW_COLLECTION: law_collection_live_structure_candidate
          CHUNKING_STRATEGY: legal_structure_v1
          SUMMARY_SOURCE_COLLECTION: law_collection_live_baseline
        run: |
          python -m scripts.build_index
          python -m scripts.audit_law_collection --output live-candidate-audit.json
          python -m scripts.retrieval_benchmark --run-retrieval --collection "$LAW_COLLECTION" --chunking-strategy "$CHUNKING_STRATEGY" --baseline live-baseline.json --collection-audit live-candidate-audit.json --output live-candidate.json
      - name: Enforce production promotion gate
        run: >-
          python -c "import json; result=json.load(open('live-candidate.json', encoding='utf-8'));
          assert result['promotion']['promotable'], result['promotion']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-retrieval-evaluation
          path: |
            live-baseline.json
            live-baseline-audit.json
            live-candidate.json
            live-candidate-audit.json
