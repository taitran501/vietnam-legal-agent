name: Promptfoo Deterministic Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.x"
          cache: npm
          cache-dependency-path: .github/workflows/promptfoo-eval.yml
      - name: Install Python and Promptfoo dependencies in parallel
        run: |
          set +e
          npx --yes promptfoo@0.122.0 --version &
          promptfoo_pid=$!
          uv pip install --system -e ".[dev]" &
          pip_pid=$!

          wait "$promptfoo_pid"
          promptfoo_status=$?
          wait "$pip_pid"
          pip_status=$?

          if [ "$promptfoo_status" -ne 0 ] || [ "$pip_status" -ne 0 ]; then
            echo "Dependency setup failed (Promptfoo=$promptfoo_status, pip=$pip_status)."
            exit 1
          fi
      - name: Verify replay adapter contract
        run: python -m pytest -q tests/eval/test_promptfoo_adapter.py
      - name: Run deterministic replay matrix
        run: >-
          npx --yes promptfoo@0.122.0 eval
          -c promptfooconfig.yaml
          --output artifacts/promptfoo-eval.json
      - name: Upload Promptfoo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval-${{ github.sha }}
          path: artifacts/promptfoo-eval.json
          if-no-files-found: error
          retention-days: 30
