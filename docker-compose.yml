services:
  postgres:
    image: postgres:16-alpine
    container_name: epr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epr}
      POSTGRES_USER: ${POSTGRES_USER:-epr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epr_local_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: epr_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: epr_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: epr_backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      USE_QDRANT_CLOUD: "false"
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://${POSTGRES_USER:-epr}:${POSTGRES_PASSWORD:-epr_local_dev_only}@postgres:5432/${POSTGRES_DB:-epr}
      HISTORY_DUAL_WRITE_SESSION: "false"
      LAW_COLLECTION: law_collection
      LAW_COLLECTION_ALIAS: law_collection
      CORPUS_ID: epr
      INDEX_SCHEMA_VERSION: legal-structure-v2
      CHUNKING_PROFILE: legal-structure-v2
      EMBEDDING_PROFILE: openai-text-embedding-3-small-v1
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
      ENABLE_TRACE_DEBUG_API: ${ENABLE_TRACE_DEBUG_API:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "scripts.ensure_law_index"]
    restart: "no"
    env_file:
      - .env
    environment:
      USE_QDRANT_CLOUD: "false"
      QDRANT_URL: http://qdrant:6333
      LAW_COLLECTION_ALIAS: law_collection
      CORPUS_ID: epr
      INDEX_SCHEMA_VERSION: legal-structure-v2
      CHUNKING_PROFILE: legal-structure-v2
      CHUNKING_STRATEGY: legal_structure_v2
      EMBEDDING_PROFILE: openai-text-embedding-3-small-v1
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
      SUMMARY_CACHE_PATH: /app/artifacts/index_summary_cache.json
    volumes:
      - indexer_cache:/app/artifacts
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: epr_frontend
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: epr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  indexer_cache:
