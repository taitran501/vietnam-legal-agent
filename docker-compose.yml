services:
  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: epr_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # bind to loopback only — not exposed to LAN
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: epr_backend
    restart: unless-stopped
    expose:
      - "8000"                  # internal only; Nginx proxies from outside
    env_file:
      - .env                    # injected at runtime, NOT baked into image
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: epr_frontend
    restart: unless-stopped
    expose:
      - "8501"                  # internal only; Nginx proxies from outside
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx reverse proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: epr_nginx
    restart: unless-stopped
    ports:
      - "80:80"                 # the only port exposed to the LAN
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  redis_data:
