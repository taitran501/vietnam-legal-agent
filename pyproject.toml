[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-legal-agent"
version = "0.2.0"
description = "Bounded agentic workflow for Vietnamese legal research and preliminary case analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "sse-starlette==2.1.3",
    "langchain==0.3.7",
    "langchain-community==0.3.7",
    "langchain-openai==0.2.9",
    "langchain-core==0.3.19",
    "langgraph==0.2.53",
    "qdrant-client>=1.12.0,<1.13.0",
    "langchain-qdrant==0.2.0",
    "openai>=1.50.0,<2.0.0",
    "tavily-python==0.5.0",
    "redis==5.1.1",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "tiktoken>=0.8,<1",
    "lark==1.2.2",
    "tqdm>=4.66.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "PyJWT[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
observability = ["langsmith>=0.1,<1.0"]
cross-encoder = ["sentence-transformers>=3.0.0"]
universal = ["pyarrow>=17,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epr_agent = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["epr_agent"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["backend.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["jwt", "pythonjsonlogger", "sentence_transformers"]
ignore_missing_imports = true
